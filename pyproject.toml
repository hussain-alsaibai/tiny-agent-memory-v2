[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent-memory"
version = "2.0.0"
description = "Tiered episodic + semantic + working memory for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["agent", "memory", "ai", "context", "tiered-memory", "episodic", "semantic"]

[project.optional-dependencies]
snapdb = ["snapdb"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-agent-memory-v2"
Repository = "https://github.com/hussain-alsaibai/tiny-agent-memory-v2"
